name: Lab metadata

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 -m pip install -r .meta/requirements.txt -r .meta/importers/requirements.txt
      - run: python3 -m unittest discover -s .meta/tests
      - name: Check the server performance solution on Linux
        run: |
          bash -n niches/code/devops/roadmap-sh/01-server-performance-stats/server-stats.sh
          make -C niches/code/devops/roadmap-sh/01-server-performance-stats test-linux
      - name: Check the log archive tool
        run: python3 -m unittest discover -s niches/code/devops/roadmap-sh/02-log-archive-tool -p 'test_*.py' -v
      - run: python3 .meta/scripts/lab_sync.py --check
      - run: python3 .meta/scripts/catalog.py --check
      - run: python3 .meta/scripts/atlas.py --check
