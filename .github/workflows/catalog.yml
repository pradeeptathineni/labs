name: Lab metadata

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 -m pip install -r .meta/requirements.txt -r .meta/importers/requirements.txt
      - run: python3 -m unittest discover -s .meta/tests
      - name: Check the server performance solution on Linux
        run: |
          bash -n niches/code/devops/roadmap-sh/01-server-performance-stats/server-stats.sh
          make -C niches/code/devops/roadmap-sh/01-server-performance-stats test-linux
      - name: Check the log archive tool
        run: python3 -m unittest discover -s niches/code/devops/roadmap-sh/02-log-archive-tool -p 'test_*.py' -v
      - name: Check the first Project Euler solution
        run: python3 -m unittest discover -s niches/code/mathematics/project-euler/01-multiples-of-3-or-5 -p 'test_*.py' -v
      - name: Check programming lab solutions
        run: |
          bash -n niches/code/programming/bash/exercism/error-handling/src/error_handling.sh
          python3 -m unittest discover -s niches/code/programming/bash/exercism/error-handling/tests -p 'test_*.py' -v
          python3 -m unittest discover -s niches/code/programming/python/exercism/grep/tests -p 'test_*.py' -v
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Check the unfinished Go quiz
        working-directory: niches/code/programming/go/gophercises/csv-quiz
        run: |
          go test -race ./...
          go vet ./...
      - run: python3 .meta/scripts/lab_sync.py --check
      - run: python3 .meta/scripts/catalog.py --check
      - run: python3 .meta/scripts/atlas.py --check
