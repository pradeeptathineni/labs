# 25-multi-service-application/nginx.conf - Route the page and API
events {}
http {
    # Send request logs to Docker for rotation
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Keep the app behind one local entry point
    server {
        listen 80;
        location = /health { return 200 'ready\n'; }
        location /api/ { proxy_pass http://api:3000/; }
        location / { proxy_pass http://web:80; }
    }
}
